<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>伊朋工作坊・課程預約</title>
<script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
  :root {
    --bg: #f6f1e9;
    --card: #fffdf9;
    --ink: #2f2a25;
    --muted: #8a7f73;
    --line: #e7ddcf;
    --accent: #b4643a;
    --accent-ink: #fff;
    --accent-soft: #f3e1d4;
    --ok: #4f7a52;
    --ok-soft: #e3eedf;
    --warn: #b23b2e;
    --warn-soft: #f6dfdb;
    --radius: 16px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); }
  body {
    font: 15px/1.55 -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
    -webkit-font-smoothing: antialiased;
    padding-bottom: calc(24px + env(safe-area-inset-bottom));
  }
  button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }
  .wrap { max-width: 560px; margin: 0 auto; padding: 0 16px; }

  header { padding: 22px 0 10px; }
  .brand { font-size: 13px; letter-spacing: .12em; color: var(--accent); font-weight: 600; }
  h1 { margin: 2px 0 0; font-size: 24px; letter-spacing: .02em; }
  .hello { color: var(--muted); font-size: 14px; margin-top: 2px; }

  .tabs { position: sticky; top: 0; z-index: 5; background: var(--bg); padding: 10px 0 12px; display: flex; gap: 8px; }
  .tab { flex: 1; padding: 10px 0; border-radius: 999px; background: var(--card); border: 1px solid var(--line); font-weight: 600; color: var(--muted); }
  .tab[aria-selected="true"] { background: var(--ink); color: #fff; border-color: var(--ink); }
  .tab .count { display: inline-block; min-width: 20px; padding: 0 6px; margin-left: 4px; border-radius: 999px; background: var(--accent); color: #fff; font-size: 12px; line-height: 20px; }

  .banner { display: flex; gap: 12px; align-items: center; background: var(--accent-soft); border-radius: var(--radius); padding: 12px 14px; margin-bottom: 12px; font-size: 14px; }
  .banner b { display: block; }
  .banner button { margin-left: auto; flex: none; background: var(--accent); color: var(--accent-ink); padding: 8px 14px; border-radius: 999px; font-weight: 600; font-size: 14px; }

  .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; margin-bottom: 12px; display: flex; gap: 14px; }
  .date { flex: none; width: 62px; text-align: center; border-radius: 12px; background: var(--accent-soft); color: var(--accent); padding: 8px 0 6px; align-self: flex-start; }
  .date .m { font-size: 12px; font-weight: 600; }
  .date .d { font-size: 26px; font-weight: 700; line-height: 1.1; }
  .date .w { font-size: 12px; }
  .info { flex: 1; min-width: 0; }
  .title { font-size: 17px; font-weight: 700; margin: 0 0 4px; }
  .meta { color: var(--muted); font-size: 13.5px; }
  .meta span { white-space: nowrap; margin-right: 10px; }
  .desc { font-size: 13.5px; margin: 6px 0 0; color: #5d544b; }
  .row { display: flex; align-items: center; gap: 10px; margin-top: 12px; }
  .seats { font-size: 13px; color: var(--ok); font-weight: 600; }
  .seats.low { color: var(--accent); }
  .seats.none { color: var(--muted); }
  .bar { height: 4px; border-radius: 4px; background: var(--line); margin-top: 4px; overflow: hidden; width: 110px; }
  .bar i { display: block; height: 100%; background: var(--ok); }
  .seats.low + .bar i { background: var(--accent); }
  .seats.none + .bar i { background: #c9bfb2; }
  .btn { margin-left: auto; background: var(--accent); color: var(--accent-ink); padding: 9px 18px; border-radius: 999px; font-weight: 700; }
  .btn:disabled { background: var(--line); color: var(--muted); cursor: default; }
  .btn.ghost { background: transparent; border: 1px solid var(--line); color: var(--ink); }
  .btn.danger { background: var(--warn); color: #fff; }
  .price { font-weight: 700; }

  .empty { text-align: center; color: var(--muted); padding: 48px 12px; }
  .empty .icon { font-size: 34px; }

  /* 表單（底部抽屜） */
  .sheet-bg { position: fixed; inset: 0; background: rgba(40, 30, 20, .4); opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 20; }
  .sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 21; background: var(--card); border-radius: 22px 22px 0 0; max-height: 92vh; overflow: auto; transform: translateY(100%); transition: transform .25s ease; padding: 8px 0 calc(20px + env(safe-area-inset-bottom)); }
  .open .sheet-bg { opacity: 1; pointer-events: auto; }
  .open .sheet { transform: none; }
  .grip { width: 40px; height: 5px; border-radius: 5px; background: var(--line); margin: 4px auto 12px; }
  .sheet h2 { font-size: 19px; margin: 0 0 2px; }
  .summary { background: var(--bg); border-radius: 12px; padding: 10px 12px; margin: 12px 0 16px; font-size: 14px; }
  label { display: block; font-size: 13px; font-weight: 600; color: var(--muted); margin: 12px 0 6px; }
  input, textarea { width: 100%; font: inherit; font-size: 16px; padding: 12px; border-radius: 12px; border: 1px solid var(--line); background: #fff; color: var(--ink); }
  input:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: transparent; }
  textarea { resize: none; height: 72px; }
  .stepper { display: flex; align-items: center; gap: 0; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; width: max-content; background: #fff; }
  .stepper button { width: 48px; height: 46px; font-size: 22px; color: var(--accent); }
  .stepper button:disabled { color: var(--line); }
  .stepper output { width: 56px; text-align: center; font-size: 18px; font-weight: 700; }
  .hint { font-size: 12.5px; color: var(--muted); margin-top: 6px; }
  .total { display: flex; justify-content: space-between; align-items: baseline; margin: 18px 0 12px; font-size: 14px; color: var(--muted); }
  .total b { color: var(--ink); font-size: 20px; }
  .wide { width: 100%; padding: 14px; font-size: 16px; border-radius: 14px; }
  .actions { display: flex; gap: 10px; margin-top: 8px; }
  .actions .btn { flex: 1; margin: 0; padding: 13px; border-radius: 14px; text-align: center; }

  .done { text-align: center; padding: 8px 0 4px; }
  .done .check { width: 64px; height: 64px; border-radius: 50%; background: var(--ok-soft); color: var(--ok); font-size: 34px; line-height: 64px; margin: 4px auto 10px; }
  .done .summary { text-align: left; }

  .mine .people { display: inline-block; background: var(--ok-soft); color: var(--ok); font-weight: 600; font-size: 12.5px; padding: 1px 8px; border-radius: 999px; }

  .toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom)); transform: translate(-50%, 20px); background: var(--ink); color: #fff; padding: 11px 18px; border-radius: 12px; font-size: 14px; max-width: calc(100% - 32px); opacity: 0; transition: .2s; z-index: 40; pointer-events: none; }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
  .toast.err { background: var(--warn); }

  .loading { text-align: center; padding: 60px 0; color: var(--muted); }
  .spin { width: 28px; height: 28px; border-radius: 50%; border: 3px solid var(--line); border-top-color: var(--accent); animation: spin .8s linear infinite; margin: 0 auto 12px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .busy { opacity: .6; pointer-events: none; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="brand">伊朋工作坊</div>
      <h1>課程預約</h1>
      <div class="hello" id="hello"></div>
    </header>

    <nav class="tabs" role="tablist">
      <button class="tab" role="tab" id="tab-sessions" aria-selected="true">近期場次</button>
      <button class="tab" role="tab" id="tab-mine" aria-selected="false">我的預約</button>
    </nav>

    <div id="friend" class="banner" hidden>
      <div><b>加入好友才收得到課前提醒</b>預約成功後，開課前一天會用 LINE 通知你</div>
      <button id="add-friend">加好友</button>
    </div>

    <main id="main"><div class="loading"><div class="spin"></div>載入中…</div></main>
  </div>

  <div id="sheet-root">
    <div class="sheet-bg" id="sheet-bg"></div>
    <div class="sheet" role="dialog" aria-modal="true"><div class="wrap" id="sheet"></div></div>
  </div>
  <div class="toast" id="toast"></div>

<script>
/* ========= 設定 ========= */
const LIFF_ID = '2012347943-naGvenRX';
const API_URL = 'https://script.google.com/macros/s/AKfycbyYvlEX8Jc37nBlYAyYz1c7wmwXVuSkCGywX98o7MTovT9l5T5Hs0f7cfULgD4_K1JO/exec';
const OA_ID = '@983plkls';
const MAX_PEOPLE = 5;
/* ======================== */

const DEMO = new URLSearchParams(location.search).has('demo');
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const money = n => n ? 'NT$ ' + Number(n).toLocaleString('zh-TW') : '免費';

const state = { tab: 'sessions', sessions: [], bookings: [], last: null, name: '', idToken: '' };

/* ---------- API ---------- */
async function api(action, data = {}) {
  if (DEMO) return demoApi(action, data);
  const res = await fetch(API_URL, {
    method: 'POST',
    body: JSON.stringify(Object.assign({ action, idToken: state.idToken }, data))
  });
  const json = await res.json();
  if (!json.ok) throw new Error(json.error || '發生錯誤');
  return json;
}

function apply(json) {
  if (json.sessions) state.sessions = json.sessions;
  if (json.bookings) state.bookings = json.bookings;
  render();
}

/* ---------- 畫面 ---------- */
function render() {
  $('#tab-sessions').setAttribute('aria-selected', state.tab === 'sessions');
  $('#tab-mine').setAttribute('aria-selected', state.tab === 'mine');
  $('#tab-mine').innerHTML = '我的預約' + (state.bookings.length ? `<span class="count">${state.bookings.length}</span>` : '');
  $('#main').innerHTML = state.tab === 'sessions' ? sessionsHtml() : mineHtml();
}

function sessionsHtml() {
  if (!state.sessions.length) {
    return `<div class="empty"><div class="icon">🌿</div>目前沒有開放的場次<br>新課程開放時會在這裡公布</div>`;
  }
  const mine = new Set(state.bookings.map(b => b.sessionId));
  return state.sessions.map(s => {
    const pct = s.capacity ? Math.round((s.capacity - s.remaining) / s.capacity * 100) : 100;
    const cls = s.remaining === 0 ? 'none' : s.remaining <= 2 ? 'low' : '';
    const seats = s.remaining === 0 ? '已額滿' : `剩 ${s.remaining} 位`;
    let btn;
    if (mine.has(s.id)) btn = `<button class="btn ghost" data-go="mine">已預約</button>`;
    else if (s.closed) btn = `<button class="btn" disabled>已截止</button>`;
    else if (s.remaining === 0) btn = `<button class="btn" disabled>額滿</button>`;
    else btn = `<button class="btn" data-book="${s.id}">預約</button>`;
    return `
      <article class="card">
        <div class="date"><div class="m">${esc(s.month)}</div><div class="d">${esc(s.day)}</div><div class="w">${esc(s.weekday)}</div></div>
        <div class="info">
          <h3 class="title">${esc(s.title)}</h3>
          <div class="meta"><span>🕒 ${esc(s.timeText)}</span>${s.location ? `<span>📍 ${esc(s.location)}</span>` : ''}<span class="price">${money(s.price)}</span></div>
          ${s.description ? `<p class="desc">${esc(s.description)}</p>` : ''}
          <div class="row">
            <div><div class="seats ${cls}">${seats}</div><div class="bar"><i style="width:${pct}%"></i></div></div>
            ${btn}
          </div>
        </div>
      </article>`;
  }).join('');
}

function mineHtml() {
  if (!state.bookings.length) {
    return `<div class="empty"><div class="icon">📭</div>還沒有預約<br><button class="btn" style="margin:16px auto 0" data-go="sessions">看看近期場次</button></div>`;
  }
  return state.bookings.map(b => `
    <article class="card mine">
      <div class="info">
        <h3 class="title">${esc(b.title)}</h3>
        <div class="meta"><span>📅 ${esc(b.dateText)} ${esc(b.timeText)}</span>${b.location ? `<span>📍 ${esc(b.location)}</span>` : ''}</div>
        <div class="meta" style="margin-top:6px"><span class="people">${b.people} 位</span> <span>${esc(b.name)}・${esc(b.phone)}</span></div>
        ${b.note ? `<p class="desc">備註：${esc(b.note)}</p>` : ''}
        <div class="row"><span class="meta">預約編號 #${b.id}</span>
          ${b.canCancel ? `<button class="btn ghost" data-cancel="${b.id}">取消預約</button>` : ''}
        </div>
      </div>
    </article>`).join('');
}

/* ---------- 預約表單 ---------- */
let form = null;

function openSheet(html) {
  $('#sheet').innerHTML = '<div class="grip"></div>' + html;
  document.body.classList.add('open');
}
function closeSheet() { document.body.classList.remove('open'); form = null; }

function openForm(id) {
  const s = state.sessions.find(x => x.id === id);
  if (!s) return;
  const max = Math.min(MAX_PEOPLE, s.remaining);
  form = { s, people: 1, max };
  const last = state.last || {};
  openSheet(`
    <h2>${esc(s.title)}</h2>
    <div class="summary">📅 ${esc(s.dateText)} ${esc(s.timeText)}${s.location ? `<br>📍 ${esc(s.location)}` : ''}<br>💰 ${money(s.price)} / 人</div>
    <form id="book-form" novalidate>
      <label for="f-name">姓名</label>
      <input id="f-name" autocomplete="name" maxlength="30" value="${esc(last.name || state.name || '')}" required>
      <label for="f-phone">手機</label>
      <input id="f-phone" type="tel" inputmode="tel" autocomplete="tel" maxlength="20" placeholder="0912 345 678" value="${esc(last.phone || '')}" required>
      <label>人數</label>
      <div class="stepper"><button type="button" id="minus" aria-label="減少">−</button><output id="people">1</output><button type="button" id="plus" aria-label="增加">＋</button></div>
      <div class="hint">此場次剩 ${s.remaining} 位，每筆最多 ${MAX_PEOPLE} 位</div>
      <label for="f-note">備註（選填）</label>
      <textarea id="f-note" maxlength="200" placeholder="例如：素食、需要停車位、同行者姓名"></textarea>
      <div class="total"><span>合計</span><b id="total">${money(s.price)}</b></div>
      <button class="btn wide" id="submit">確認預約</button>
    </form>`);
  updatePeople();
}

function updatePeople() {
  $('#people').textContent = form.people;
  $('#minus').disabled = form.people <= 1;
  $('#plus').disabled = form.people >= form.max;
  $('#total').textContent = money(form.s.price * form.people);
}

async function submitForm(e) {
  e.preventDefault();
  const name = $('#f-name').value.trim();
  const phone = $('#f-phone').value.trim();
  if (!name) return toast('請填寫姓名', true), $('#f-name').focus();
  if (!/^[0-9+\-\s()]{8,20}$/.test(phone)) return toast('請填寫正確的手機號碼', true), $('#f-phone').focus();

  const btn = $('#submit');
  btn.disabled = true; btn.textContent = '送出中…';
  try {
    const json = await api('book', { sessionId: form.s.id, name, phone, people: form.people, note: $('#f-note').value.trim() });
    state.last = { name, phone };
    apply(json);
    showDone(json.booking);
  } catch (err) {
    toast(err.message, true);
    btn.disabled = false; btn.textContent = '確認預約';
    try { apply(await api('init')); } catch (_) {}
  }
}

function showDone(b) {
  form = null;
  openSheet(`
    <div class="done">
      <div class="check">✓</div>
      <h2>預約成功</h2>
      <div class="hint">預約編號 #${b.id}・開課前一天會用 LINE 提醒你</div>
      <div class="summary">${esc(b.title)}<br>📅 ${esc(b.dateText)} ${esc(b.timeText)}${b.location ? `<br>📍 ${esc(b.location)}` : ''}<br>👥 ${b.people} 位</div>
      <div class="actions">
        <button class="btn ghost" id="see-mine">我的預約</button>
        <button class="btn" id="finish">完成</button>
      </div>
    </div>`);
}

/* ---------- 取消 ---------- */
async function cancelBooking(btn) {
  if (btn.dataset.confirm !== '1') {
    btn.dataset.confirm = '1';
    btn.className = 'btn danger';
    btn.textContent = '確定取消？';
    setTimeout(() => { if (btn.isConnected && btn.dataset.confirm === '1') { btn.dataset.confirm = ''; btn.className = 'btn ghost'; btn.textContent = '取消預約'; } }, 4000);
    return;
  }
  btn.closest('.card').classList.add('busy');
  try {
    apply(await api('cancel', { bookingId: Number(btn.dataset.cancel) }));
    toast('已取消預約');
  } catch (err) {
    toast(err.message, true);
    render();
  }
}

/* ---------- 其他 ---------- */
let toastTimer;
function toast(msg, err) {
  const t = $('#toast');
  t.textContent = msg;
  t.className = 'toast show' + (err ? ' err' : '');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.className = 'toast', 2600);
}

function finish() {
  closeSheet();
  if (!DEMO && window.liff && liff.isInClient()) liff.closeWindow();
}

document.addEventListener('click', e => {
  const t = e.target.closest('button, .sheet-bg');
  if (!t) return;
  if (t.id === 'tab-sessions' || t.dataset.go === 'sessions') { state.tab = 'sessions'; render(); }
  else if (t.id === 'tab-mine' || t.dataset.go === 'mine') { state.tab = 'mine'; render(); }
  else if (t.dataset.book) openForm(Number(t.dataset.book));
  else if (t.dataset.cancel) cancelBooking(t);
  else if (t.id === 'sheet-bg') closeSheet();
  else if (t.id === 'minus' && form) { form.people = Math.max(1, form.people - 1); updatePeople(); }
  else if (t.id === 'plus' && form) { form.people = Math.min(form.max, form.people + 1); updatePeople(); }
  else if (t.id === 'see-mine') { closeSheet(); state.tab = 'mine'; render(); }
  else if (t.id === 'finish') finish();
  else if (t.id === 'add-friend') liff.openWindow({ url: 'https://line.me/R/ti/p/' + encodeURIComponent(OA_ID), external: false });
});
document.addEventListener('submit', e => { if (e.target.id === 'book-form') submitForm(e); });

/* ---------- 啟動 ---------- */
async function start() {
  try {
    if (!DEMO) {
      await liff.init({ liffId: LIFF_ID });
      if (!liff.isLoggedIn()) { liff.login({ redirectUri: location.href }); return; }
      state.idToken = liff.getIDToken();
      liff.getFriendship().then(f => { if (!f.friendFlag) $('#friend').hidden = false; }).catch(() => {});
    }
    const json = await api('init');
    state.last = json.last;
    state.name = json.name || '';
    if (state.name) $('#hello').textContent = `${state.name}，你好`;
    apply(json);
  } catch (err) {
    console.error(err);
    $('#main').innerHTML = `<div class="empty"><div class="icon">⚠️</div>${esc(err.message || '載入失敗')}<br><button class="btn" style="margin:16px auto 0" onclick="location.reload()">重新整理</button></div>`;
  }
}

/* ---------- 示範模式（網址加 ?demo 可在一般瀏覽器預覽） ---------- */
function demoApi(action, data) {
  const db = demoApi.db || (demoApi.db = {
    sessions: [
      { id: 1, title: '手工皂入門課', month: '11月', day: '8', weekday: '週六', dateText: '11/8（六）', timeText: '14:00–16:00', location: '伊朋工作坊', description: '冷製皂基礎，材料費已含，可帶回成品', price: 1200, capacity: 8, remaining: 5, closed: false },
      { id: 2, title: '蜜蠟護唇膏＆乳霜', month: '11月', day: '15', weekday: '週六', dateText: '11/15（六）', timeText: '10:00–12:00', location: '伊朋工作坊', description: '', price: 800, capacity: 6, remaining: 2, closed: false },
      { id: 3, title: '聖誕造型皂親子班', month: '12月', day: '20', weekday: '週六', dateText: '12/20（六）', timeText: '14:00–16:30', location: '伊朋工作坊', description: '適合 6 歲以上小朋友，一位大人陪同', price: 1500, capacity: 10, remaining: 0, closed: false }
    ],
    bookings: [], nextId: 1
  });
  const reply = extra => new Promise(r => setTimeout(() => r(Object.assign({ ok: true, sessions: db.sessions, bookings: db.bookings }, extra)), 300));
  if (action === 'init') return reply({ last: null, name: '示範使用者' });
  if (action === 'book') {
    const s = db.sessions.find(x => x.id === data.sessionId);
    if (data.people > s.remaining) return Promise.reject(new Error(`名額只剩 ${s.remaining} 位`));
    s.remaining -= data.people;
    const b = { id: db.nextId++, sessionId: s.id, title: s.title, dateText: s.dateText, timeText: s.timeText, location: s.location, price: s.price, people: data.people, name: data.name, phone: data.phone, note: data.note, canCancel: true };
    db.bookings.push(b);
    return reply({ booking: b });
  }
  if (action === 'cancel') {
    const i = db.bookings.findIndex(b => b.id === data.bookingId);
    const b = db.bookings.splice(i, 1)[0];
    db.sessions.find(s => s.id === b.sessionId).remaining += b.people;
    return reply();
  }
}

start();
</script>
</body>
</html>
